name: Check Deye Alerts
on:
  repository_dispatch:
    types: [deye-check]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python check_alerts.py
        env:
          DEYE_APP_ID: ${{ secrets.DEYE_APP_ID }}
          DEYE_APP_SECRET: ${{ secrets.DEYE_APP_SECRET }}
          DEYE_EMAIL: ${{ secrets.DEYE_EMAIL }}
          DEYE_PASSWORD: ${{ secrets.DEYE_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f state/device_status.json ]; then
            git add state/device_status.json
            git diff --staged --quiet || git commit -m "update device status state"
            git push
          else
            echo "No state file yet, nothing to commit"
          fi
